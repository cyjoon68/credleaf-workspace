apiVersion: apps/v1
kind: Deployment
metadata:
  name: credleaf-be
  namespace: credleaf
spec:
  replicas: 2
  selector:
    matchLabels:
      app: credleaf-be
  template:
    metadata:
      labels:
        app: credleaf-be
    spec:
      containers:
        - name: api
          image: ghcr.io/credleaf-labs/credleaf-be:develop
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
